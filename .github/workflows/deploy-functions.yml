name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  # Allow manual redeploy (e.g. after adding a new secret)
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Supabase
    runs-on: ubuntu-latest
    # Only run after typecheck passes — don't deploy broken code
    needs: []
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # No user JWT: pg_cron callers, plus meta-oauth-callback (a browser
      # redirect back from Facebook, which carries no Authorization header).
      - name: Deploy pg_cron functions (no JWT verification)
        run: |
          for fn in meta-insights-sync dhruv-anomaly-check history-retention-sweep dhruv-weekly-report meta-oauth-callback; do
            echo "Deploying $fn (no-verify-jwt)..."
            supabase functions deploy "$fn" \
              --no-verify-jwt \
              --project-ref mpvdpdxzqnidwyihyhbn
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # All other functions require a valid Supabase JWT (authenticated users only)
      - name: Deploy remaining edge functions
        run: |
          for fn in \
            aarav-orchestrate \
            canva-oauth-callback \
            canva-open-editor \
            canva-connect-init \
            canva-sync-design \
            canva-verify-return-nav \
            ingest-review \
            meta-oauth-start \
            meta-token-connect \
            meta-sync-now \
            claude-proxy \
            generate-image \
            langfuse-ingest; do
            echo "Deploying $fn..."
            supabase functions deploy "$fn" --project-ref mpvdpdxzqnidwyihyhbn
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
